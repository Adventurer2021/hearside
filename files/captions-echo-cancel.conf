# Private echo canceller for live captions. dictate.py --caption runs it as its
# own process (`pipewire -c <this file>`) for the length of a captions session,
# so nothing about the normal audio setup changes and it disappears on Stop.
#
# It takes the default microphone and removes from it whatever the default
# speakers are playing ("monitor mode": the speaker output is the reference),
# using WebRTC's echo canceller - the same technology browsers and Zoom use.
# The result is the virtual source "captions_aec_source": mostly just the
# person at the mic, while the computer's own audio is captured separately.
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = { } flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name   = aec/libspa-aec-webrtc
            monitor.mode   = true
            audio.rate     = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.noise_suppression = true
                webrtc.gain_control      = false
                webrtc.extended_filter   = true
                webrtc.delay_agnostic    = true
            }
            capture.props = {
                node.name    = "captions_aec_capture"
                node.passive = true
            }
            source.props = {
                node.name        = "captions_aec_source"
                node.description = "Captions: mic with speaker echo removed"
                # Never let the desktop pick this as the default microphone.
                priority.session = 1
                priority.driver  = 1
            }
        }
    }
]
